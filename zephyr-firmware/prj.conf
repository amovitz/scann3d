# ─── Core ────────────────────────────────────────────────────────────────────
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_HEAP_MEM_POOL_SIZE=65536

# ─── Pin control (required by all ESP32-C3 peripheral nodes) ─────────────────
# Must be enabled before I2C, UART, and LEDC/PWM; the GPIO matrix routing
# is expressed entirely through pinctrl in Zephyr 3.4+.
CONFIG_PINCTRL=y

# ─── GPIO (LED channels, XSHUT) ──────────────────────────────────────────────
CONFIG_GPIO=y

# ─── I2C (VL53L8CX + LSM6DSV sensors) ───────────────────────────────────────
CONFIG_I2C=y

# ─── UART (IO20/IO21 auxiliary serial port) ───────────────────────────────────
CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=y
CONFIG_UART_LINE_CTRL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_CONSOLE=y

# ─── PWM - ESP32-C3 LEDC peripheral (servo on IO9) ───────────────────────────
CONFIG_PWM=y

# ─── Networking / WiFi / UDP ──────────────────────────────────────────────────
CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_UDP=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_CONFIG_SETTINGS=y
CONFIG_NET_CONFIG_NEED_IPV4=y

CONFIG_WIFI_ESP32=y
CONFIG_WIFI=y

# Static IP - change these to match your network, or enable DHCP below.
# CONFIG_NET_CONFIG_MY_IPV4_ADDR="192.168.1.200"
# CONFIG_NET_CONFIG_MY_IPV4_GW="192.168.1.1"
# CONFIG_NET_CONFIG_MY_IPV4_NETMASK="255.255.255.0"

# Set DHCP to y to obtain address automatically (overrides static IP above).
CONFIG_NET_DHCPV4=y

# WiFi credentials - override at build time with -DCONFIG_SCANNER_WIFI_SSID=...
# or edit directly here.
CONFIG_SCANNER_WIFI_SSID="your_ssid"
CONFIG_SCANNER_WIFI_PSK="your_password"

# UDP target host and port (where the PC receiver listens)
CONFIG_SCANNER_UDP_HOST="192.168.1.100"
CONFIG_SCANNER_UDP_PORT=5005

# ─── Logging ──────────────────────────────────────────────────────────────────
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_PRINTK=y

# ─── Network buffer pools ────────────────────────────────────────────────────
CONFIG_NET_PKT_RX_COUNT=8
CONFIG_NET_PKT_TX_COUNT=16
CONFIG_NET_BUF_RX_COUNT=16
CONFIG_NET_BUF_TX_COUNT=32

# ─── Floating point (servo position calculation uses float) ──────────────────
# The ESP32-C3 (RISC-V RV32IMC) has no hardware FPU; soft-float is used.
# No extra Kconfig is needed - GCC emits soft-float by default for this target.

# ─── Misc ────────────────────────────────────────────────────────────────────
CONFIG_ENTROPY_DEVICE_RANDOM_GENERATOR=y
CONFIG_REBOOT=y
